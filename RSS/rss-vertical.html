<!doctype html>
<html lang="pt-BR" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.5">
  <title>RSS Feed OBS - Visualizador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
    
    * {
      font-family: 'Poppins', sans-serif;
    }
    
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    
    .slide-enter {
      animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    @keyframes slideIn {
      0% {
        opacity: 0;
        transform: translateX(120px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    /*
    .glow {
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.4),
                  0 0 80px rgba(236, 72, 153, 0.2);
    }*/
    
    /* Responsividade para diferentes tamanhos de tela */
    @media (max-width: 768px) {
      .slide-enter {
        animation: slideInMobile 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      @keyframes slideInMobile {
        0% {
          opacity: 0;
          transform: translateY(60px) scale(0.95);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    }
  </style>
  
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full w-full ">
  <div id="viewer-container" class="h-full w-full relative overflow-hidden"><!-- Background decorative elements -->
   <div class="absolute top-0 left-0 w-full h-full opacity-20 pointer-events-none">
    <div class="absolute top-20 left-20 w-96 h-96 bg-purple-500 rounded-full blur-3xl"></div>
    <div class="absolute bottom-20 right-20 w-96 h-96 bg-pink-500 rounded-full blur-3xl"></div>
   </div><!-- Carousel Container -->
   <div class="absolute inset-0 flex items-center justify-center p-4 sm:p-6 md:p-8 lg:p-12">
    <div id="carousel-slide" class="w-full h-full flex items-center justify-center"><!-- Slide content will be inserted here -->
    </div>
   </div><!-- Slide Indicators -->
   <div class="absolute bottom-4 sm:bottom-8 md:bottom-12 left-1/2 transform -translate-x-1/2 flex space-x-2 sm:space-x-3 z-10" id="slide-indicators"><!-- Indicators will be inserted here -->
   </div><!-- Empty State -->
   <div id="empty-state" class="hidden absolute inset-0 flex items-center justify-center p-4">
    <div class="text-center">
     <div class="text-6xl sm:text-7xl md:text-9xl mb-4 sm:mb-6">
      📺
     </div>
     <p class="text-white text-2xl sm:text-3xl md:text-4xl font-bold mb-2 sm:mb-4 px-4">Nenhum slide configurado</p>
     <p class="text-purple-300 text-base sm:text-lg md:text-xl px-4">Edite o array 'slides' no código HTML</p>
    </div>
   </div>
  </div>
  <script>
    // 🎨 CONFIGURAÇÃO DOS SLIDES
    // Edite aqui seus slides! Adicione quantos quiser!
    const slides = [


      {
        title: `No Trap`,
        description: `Uma coletania de musicas do hip hop e trap, que levou anos para ser publicada. "Eu esperava o momento certo para isso, e nessa época muitas coisas aconteceram e entendi que era o mmomento de deixar o que eu tinha levado anos para produzir vir a publico. Foi um momento marcante para minha vida." disse Carlloff em publicação em suas redes sociais. `,
        image_url: "./Assets/notrap.png",
        datanoticia: "09 de Março de 2025"
      },

      {
        title: `Drum'n Vibes`,
        description: `Um estilo ainda pouco explorado na cena eletronica, o Drum'n Bass vem retradado em batidas marcantes com o novo album do artista. Musicas com estilo renomado e com a cara desse que tem sido a voz atual da musica eletronica no You Tube. Em pubilicação em suas redes, Carlloff disse que foi um momento que marcou muito sua vida, pois toda produção ocorreu durante sua luta contra o cancer, chegando a terminar o seu album quando ainda estava no hostipal por cirurgia. "Foi um momento de superação da minha vida toda, terminar um trabalho deste porte enquanto lutava contra o cancêr"`,
        image_url: "./Assets/drumnvibes.png",
        datanoticia: "09 de Março de 2025"
      },
                 
      {
        title: `Carlloff The Best lança um novo single`,
        description: `Desafios Superados é a nova música do produtor que tem se dedicado a aprimorar a cena com estilos mais vibrantes e que trazem uma pegada motivadora. "Eu quero ver as pessoas sentindo coisas boas quando ouvirem minhas musicas" disse Carlloff durante o lançamento.`,
        image_url: "./Assets/desafiossuperados.png",
        datanoticia: "04 de Março de 2026"
      },

      {
        title: `Carlloff The Best lança 'Lost Signal'`,
        description: `A nova música do produtor tem um pegada ligada ao Techno mostrando que a criatividade está presente em seus projetos musicais. "Eu gosto de sentir as batidas e deixo a emoção ir conduzindo o processo de criação" disse Carlloff durante o lançamento.`,
        image_url: "./Assets/lostsignal.png",
        datanoticia: "24 de Abril de 2026"
      },

      {
        title: `Andromeda x Fading Horizon`,
        description: `Carlloff The Best lança 2 novoc hits monstrando que Techno tambem está presente no seu portfólio. "A verdade eu deixo a energia fluir e as batidas vão acontecendo. Faço musica por hobby. Disse em resposta no dia do lançamento."`,
        image_url: "./Assets/andromeda.png",
        datanoticia: "28 de Abril de 2026"
      },

      {
        title: `Aretha`,
        description: `Aretha The Best é a voz por traz do album No Trap produzida por Carlloff The Best. Lançado em 2025, o algum tem vozes marcantes de um estilo forte em nuances vocais brilhantes. A persona de Aretha tem se destacado nas redes sociais, visado dar brilho ao trabalho do artista."`,
        image_url: "./Assets/ARETHA.png",
        datanoticia: "15 de agosto de 2026"
      },

      {
        title: `Call`,
        description: `A persona marcante surgir com o lançamento do album No Trap, onde juntamente com Aretha simpolizam um trabalho de anos da produção em questão. Call é a persona de Carlloff com uma expressao mais descolada e destacada dos dias atuais. "É o meu mini me" disse ele sobre as primeiras apariçoes nas redes.`,
        image_url: "./Assets/Carll v2.png",
        datanoticia: "18 de setembro de 2026"
      },   
      
      {
        title: `Agatha`,
        description: `A persona de Agatha surgiu no lançamento do projeto Desafios Superados, para dar brilho a uma musica tao marcante quanto. Mostrando o poder de superação que nos somos capazes de superar. Reflete tambem a luta contra o cancer e a vitoria sobre os obstaculos na vida. "Quando escrevi esta letra, estava em meio uma luta muito dificil em minha vida, mas que foi superado com fé e gratidão." Carlloff afirma que a vitoria sobre o cancêr, lhe permitir enchera a vida com outros olhos.`,
        image_url: "./Assets/AGATHA.png",
        datanoticia: "10 de outubro de 2026"
      },  

    
    ]

      
    ;
    
    // ⚙️ CONFIGURAÇÕES DO CARROSSEL
    const SLIDE_DURATION = 15000; // Tempo em milisegundos (15000 = 15 segundos)
    
    // ============================================
    // NÃO PRECISA EDITAR DAQUI PRA BAIXO
    // ============================================
    
    let currentSlideIndex = 0;
    let carouselInterval = null;
    
    function renderCarousel() {
      const container = document.getElementById('carousel-slide');
      const emptyState = document.getElementById('empty-state');
      const indicatorsContainer = document.getElementById('slide-indicators');
      
      if (slides.length === 0) {
        container.classList.add('hidden');
        emptyState.classList.remove('hidden');
        indicatorsContainer.innerHTML = '';
        return;
      }
      
      container.classList.remove('hidden');
      emptyState.classList.add('hidden');
      
      const slide = slides[currentSlideIndex];
      
      container.innerHTML = `
        <div class="w-full max-w-sm sm:max-w-2xl md:max-w-3xl lg:max-w-3xl mx-auto slide-enter">
          <div class="bg-gradient-to-br from-red-500 to-yellow-500 backdrop-blur-2xl rounded-2xl sm:rounded-3xl p-4 sm:p-6 md:p-8 lg:p-10 border-2 border-red-50/40 glow">
            <img src="${slide.image_url}" 
              alt="${slide.title}"
              class="w-full h-48 sm:h-64 md:h-80 lg:h-[500px] object-cover rounded-xl sm:rounded-2xl mb-4 sm:mb-6 md:mb-8 border-2 border-red-600/60 shadow-2xl"
              onerror="this.src=''; this.alt='Imagem não disponível'; this.classList.add('hidden');">
            <h2 class="text-2xl sm:text-3xl md:text-4xl lg:text-3xl font-extrabold text-white mb-3 sm:mb-4 md:mb-6 leading-tight">${slide.title}</h2>
            <p class="text-base sm:text-lg md:text-xl lg:text-3xl text-purple-100 leading-relaxed">${slide.description}</p>
            <p class="text-3xl text-yellow-100 font-bold leading-relaxed">${slide.datanoticia}</p>
          </div>
        </div>
      `;
      
      indicatorsContainer.innerHTML = slides.map((_, index) => `
        <div class="h-2 sm:h-3 rounded-full transition-all duration-300 ${
          index === currentSlideIndex 
            ? 'bg-purple-400 w-8 sm:w-12 shadow-lg shadow-purple-500/50' 
            : 'bg-purple-500/30 w-2 sm:w-3 hover:bg-purple-500/50'
        }"></div>
      `).join('');
    }
    
    function startCarousel() {
      stopCarousel();
      if (slides.length <= 1) return;
      
      carouselInterval = setInterval(() => {
        currentSlideIndex = (currentSlideIndex + 1) % slides.length;
        renderCarousel();
      }, SLIDE_DURATION);
    }
    
    function stopCarousel() {
      if (carouselInterval) {
        clearInterval(carouselInterval);
        carouselInterval = null;
      }
    }
    
    // Initialize
    function init() {
      renderCarousel();
      startCarousel();
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
