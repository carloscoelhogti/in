        title: `Apple Music`,
        description: `A Apple Music confirmou que irá introduzir selos para músicas geradas por inteligência artificial ainda este ano. A plataforma de streaming anunciou sua iniciativa de rotulagem "Feito com IA" em um e-mail enviado a parceiros da indústria musical na quinta-feira (20 de agosto), obtido pela  Billboard . A partir do final deste ano, as músicas identificadas por provedores de conteúdo, como gravadoras e distribuidoras, como sendo "materialmente geradas usando IA" serão visivelmente rotuladas no Apple Music. A iniciativa complementa as Etiquetas de Transparência de IA da plataforma, introduzidas em março para permitir que os provedores de conteúdo divulguem quando a IA foi usada para criar uma parte "material" de uma faixa, composição, arte ou videoclipe. Os novos rótulos "Feito com IA" tornarão essas divulgações visíveis para os ouvintes do Apple Music.`,

    // ⚙️ CONFIGURAÇÕES DO CARROSSEL

    let currentSlideIndex = 0;

    function renderCarousel() {
      const container = document.getElementById('carousel-slide');
      const emptyState = document.getElementById('empty-state');
      const indicatorsContainer = document.getElementById('slide-indicators');
      
      if (slides.length === 0) {
        container.classList.add('hidden');

    function startCarousel() {

    function stopCarousel() {
      if (carouselInterval) {
        clearInterval(carouselInterval);
